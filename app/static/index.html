<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To Kindle">
<title>Library to Kindle</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  #file { display: none; }
  #status { margin-top: 16px; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <div class="top"><h1>Library → Kindle</h1><span class="nav" id="settings-link" hidden><a href="/logs">Logs</a> <a href="/settings">Settings</a></span></div>
  <p class="sub">Upload the <b>.acsm</b> file from Libby. The book will be sent to your Kindle.</p>

  <div class="card" id="setup" hidden>
    <h2>Welcome</h2>
    <p class="muted">Choose an access token: a password of at least 12 characters. You type it once on each device, and it keeps other people on your network out.</p>
    <label for="new-token">Access token</label>
    <input type="password" id="new-token" autocomplete="new-password">
    <button id="create">Save and continue to settings</button>
    <p id="setup-status" class="err"></p>
  </div>

  <div class="card" id="login" hidden>
    <label for="token">Access token</label>
    <input type="password" id="token" autocomplete="current-password">
    <button id="save">Continue</button>
    <p id="login-status" class="err"></p>
  </div>

  <div class="card" id="app" hidden>
    <label class="upload" for="file" id="pick">Upload .acsm file</label>
    <input type="file" id="file" accept=".acsm,application/vnd.adobe.adept+xml">
    <div id="status"></div>
    <p id="drive" class="muted" hidden></p>
    <p id="libby" class="muted" hidden></p>
    <details id="libby-loans-box" hidden>
      <summary>Your Libby loans</summary>
      <ul id="libby-loans"></ul>
    </details>
    <ul id="recent"></ul>
  </div>

  <button class="link" id="logout" hidden>Forget access token</button>
</main>
<script src="/static/common.js"></script>
<script>
const LABELS = {
  queued: "Queued…", fulfilling: "Downloading from the library…",
  removing_drm: "Removing DRM…", sending: "Emailing to Kindle…",
  done: "Sent! It should appear on your Kindle in a few minutes.", failed: "Failed",
};

onUnauthorized = () => showLogin("Wrong access token.");

function showLogin(msg = "") {
  $("login").hidden = false; $("app").hidden = true; $("logout").hidden = true; $("settings-link").hidden = true;
  $("login-status").textContent = msg;
}

async function showApp() {
  const status = await api("/api/status");
  $("login").hidden = true; $("app").hidden = false; $("logout").hidden = false; $("settings-link").hidden = false;
  if (status.problems.length) {
    setStatus("err", "Not set up yet: " + status.problems.join("; ") + ". ");
    const link = document.createElement("a");
    link.href = "/settings"; link.textContent = "Open Settings";
    $("status").appendChild(link);
  }
  renderRecent(status.recent);
  renderDrive(status.drive);
  renderLibby(status.libby);
}

function renderLibby(libby) {
  const el = $("libby");
  el.hidden = !libby.connected;
  $("libby-loans-box").hidden = !libby.connected;
  if (!libby.connected) return;
  if (libby.last_error) {
    el.className = "err";
    el.textContent = "Libby: last check failed: " + libby.last_error;
  } else {
    el.className = "muted";
    const when = libby.last_check ? new Date(libby.last_check * 1000).toLocaleTimeString() : "not yet";
    el.textContent = "Watching Libby" + (libby.auto_borrow ? " and borrowing ready holds" : "") + " (last checked " + when + ").";
  }
}

async function loadLibbyLoans() {
  const list = $("libby-loans");
  list.innerHTML = "<li class='muted'>Loading…</li>";
  try {
    const { loans } = await api("/api/libby/loans");
    list.innerHTML = "";
    if (!loans.length) list.innerHTML = "<li class='muted'>No loans right now.</li>";
    for (const loan of loans) {
      const li = document.createElement("li");
      li.className = "loan";
      const text = document.createElement("div");
      text.textContent = loan.title + (loan.author ? " · " + loan.author : "");
      const meta = document.createElement("div");
      meta.className = "muted";
      meta.textContent = loan.sendable
        ? (loan.handled ? "Already sent or skipped" : "Not sent yet")
        : (loan.type === "ebook" ? "Read in Libby only (no download)" : "Not an ebook");
      text.appendChild(meta);
      li.appendChild(text);
      if (loan.sendable) {
        const btn = document.createElement("button");
        btn.className = "secondary small";
        btn.textContent = "Send to Kindle";
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await api("/api/libby/send", { method: "POST", json: { key: loan.key } });
            btn.textContent = "Sending…";
            setStatus("", "⏳ Sending “" + loan.title + "”. You'll get an email with the result.");
            setTimeout(() => api("/api/status").then((s) => renderRecent(s.recent)).catch(() => {}), 4000);
          } catch (e) {
            btn.disabled = false;
            if (e.message !== "unauthorised") setStatus("err", "❌ " + e.message);
          }
        });
        li.appendChild(btn);
      }
      list.appendChild(li);
    }
  } catch (e) {
    list.innerHTML = "";
    const li = document.createElement("li");
    li.className = "err"; li.textContent = e.message;
    list.appendChild(li);
  }
}

$("libby-loans-box").addEventListener("toggle", () => { if ($("libby-loans-box").open) loadLibbyLoans(); });

function renderDrive(drive) {
  const el = $("drive");
  el.hidden = !drive.enabled;
  if (!drive.enabled) return;
  if (drive.last_error) {
    el.className = "err";
    el.textContent = "Google Drive folder: last check failed: " + drive.last_error;
  } else {
    el.className = "muted";
    const when = drive.last_check ? new Date(drive.last_check * 1000).toLocaleTimeString() : "not yet";
    el.textContent = "Also watching your Google Drive folder (last checked " + when + ").";
  }
}

function setStatus(cls, text) {
  $("status").className = cls; $("status").textContent = text;
}

function renderRecent(jobs) {
  const list = $("recent"); list.innerHTML = "";
  for (const job of jobs.slice(0, 5)) {
    const li = document.createElement("li");
    const when = new Date(job.created * 1000).toLocaleString();
    const state = job.status === "done" ? "✅" : job.status === "failed" ? "❌" : "⏳";
    li.textContent = `${state} ${job.title || job.filename}` + ({ drive: " (Drive)", libby: " (Libby)" }[job.source] || "");
    const meta = document.createElement("div");
    meta.className = "muted";
    meta.textContent = job.error ? `${when} · ${job.error}` : when;
    li.appendChild(meta);
    list.appendChild(li);
  }
}

async function poll(id) {
  for (;;) {
    const job = await api("/api/jobs/" + id);
    if (job.status === "failed") return setStatus("err", "❌ " + job.error);
    const label = LABELS[job.status] || job.status;
    if (job.status === "done") return setStatus("ok", "✅ " + (job.title ? `“${job.title}” sent. ` : "") + "It should appear on your Kindle in a few minutes.");
    setStatus("", "⏳ " + label);
    await new Promise((r) => setTimeout(r, 1500));
  }
}

$("file").addEventListener("change", async () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (!file) return;
  $("pick").style.pointerEvents = "none"; $("pick").style.opacity = .5;
  try {
    setStatus("", "⏳ Uploading…");
    const form = new FormData(); form.append("file", file);
    const job = await api("/api/upload", { method: "POST", body: form });
    await poll(job.id);
  } catch (e) {
    if (e.message !== "unauthorised") setStatus("err", "❌ " + e.message);
  } finally {
    $("pick").style.pointerEvents = ""; $("pick").style.opacity = "";
    api("/api/status").then((s) => { renderRecent(s.recent); renderDrive(s.drive); renderLibby(s.libby); }).catch(() => {});
  }
});

$("save").addEventListener("click", () => {
  setToken($("token").value.trim());
  showApp().catch(() => {});
});
$("token").addEventListener("keydown", (e) => { if (e.key === "Enter") $("save").click(); });
$("logout").addEventListener("click", () => { setToken(""); showLogin(); });

$("create").addEventListener("click", async () => {
  const token = $("new-token").value.trim();
  try {
    const res = await fetch("/api/setup", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || res.statusText);
    setToken(token);
    location.href = "/settings";
  } catch (e) {
    $("setup-status").textContent = e.message;
  }
});

(async () => {
  const setup = await fetch("/api/setup").then((r) => r.json()).catch(() => ({}));
  if (setup.needs_setup) { $("setup").hidden = false; return; }
  getToken() ? showApp().catch(() => {}) : showLogin();
})();
</script>
</body>
</html>
